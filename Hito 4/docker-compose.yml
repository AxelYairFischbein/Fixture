services:
  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi8-slim
    container_name: fixture2030-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: fixture2030
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: