services:
  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi8-slim
    container_name: fixture2030-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: fixture2030
    volumes:
      - mongodb_data:/data/db
      - ./scripts:/workspace/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "if (!db.adminCommand({ ping: 1 }).ok) { quit(2); }"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s

volumes:
  mongodb_data:
